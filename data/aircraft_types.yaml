# Maintenance programme parameters, by aircraft TYPE (not just body size).
# A-check: light, overnight-able. C-check: heavy, aircraft out of service.
# D-check: heaviest structural check.
#
# Tier 1 public-source proxy, synthesized from manufacturer MPD summaries and
# industry MRO reporting (Airbus/Boeing maintenance-program overviews, SimpleFlying,
# AeroTime, Aviation Week, ResearchGate; researched 2026-08). Real intervals vary by
# *generation*, not just body size -- Airbus's neo-family MSG-3 program runs
# materially longer A/C-check intervals than the legacy ceo family, and modern
# widebodies (787/A350) run longer heavy-check cycles than legacy wide types.
#
# KNOWN LIMITATION: these are typical/baseline figures, not Air India's approved
# maintenance program. Real intervals are operator-customizable -- e.g. the 777 has
# no fixed OEM check schedule at all ("usage parameter program"); Emirates runs
# 2,500 FH A-checks against a ~400-600 FH typical/baseline figure used here. B777-9
# and A321XLR are estimated by extrapolating the typical new-generation extension
# pattern from their in-service siblings, since neither has enough public in-service
# MRO history yet. Replace with Air India's real MPD/MRBR data in Tier 2.
maintenance:
  A319:
    a_check_interval_fh: 500
    a_check_downtime_h: 14
    c_check_interval_months: 20
    c_check_downtime_days: 16
    d_check_interval_years: 8
    d_check_downtime_days: 28
